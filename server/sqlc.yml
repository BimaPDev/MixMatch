version: "2"
sql:
  - schema: "db/migration/" # <--- CHANGED: Points to the folder containing .sql migration files
    queries: "db/query/" # Points to your query folder (user.sql, items.sql)
    engine: "postgresql"
    gen:
      go:
        package: "repository"
        out: "internal/adapter/repository"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
